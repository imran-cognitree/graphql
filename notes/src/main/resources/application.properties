# Application
spring.application.name=notes

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:notesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-create tables from entities on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Log every SQL statement
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# GraphQL
# Enable GraphiQL — the browser IDE for testing queries
spring.graphql.graphiql.enabled=true

# Where Spring looks for .graphqls schema files
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls
